---
default_language_version:
  node: 22.22.3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^cubist/src
      - id: trailing-whitespace
        exclude: ^cubist/src
      - id: check-merge-conflict
      - id: name-tests-test
        args: [--pytest-test-first]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.15
    hooks:
      # Run the linter.
      - id: ruff
      # Run the formatter.
      - id: ruff-format
        exclude: ^cubist/src
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/thlorenz/doctoc
    rev: v2.4.1
    hooks:
      - id: doctoc
  - repo: https://github.com/crate-ci/typos
    rev: v1.47.0
    hooks:
      - id: typos
        exclude: ^cubist/src
        args: []
  - repo: https://github.com/pycqa/isort
    rev: 9.0.0a3
    hooks:
      - id: isort
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.3
    hooks:
      - id: commitizen
  - repo: https://github.com/PyCQA/doc8
    rev: v2.0.0
    hooks:
      - id: doc8
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.164.0
    hooks:
      - id: semgrep-docker
        name: semgrep
        description: This hook runs semgrep (a.k.a. semgrep:latest)
        language: docker_image
        # See the comment above for why we set those SEMGREP_XXX variables
        entry: -e SEMGREP_LOG_FILE=/tmp/out.log -e SEMGREP_VERSION_CACHE_PATH=/tmp/cache semgrep/semgrep:latest semgrep
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # or `entry: poetry run mypy`, but perhaps both are the same
        entry: uv run mypy
        require_serial: true
        # From the docs it is not clear the difference between `language: python` VS `language: system`
        language: system
        types: [ python ]
